version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: deriv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deriv_user
      POSTGRES_PASSWORD: deriv_pass
      POSTGRES_DB: deriv_db
    ports:
      - "5432:5432"
    volumes:
      - deriv_pg_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: deriv_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  deriv_pg_data:

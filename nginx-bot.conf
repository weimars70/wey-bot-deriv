##############################################################################
#  nginx-bot.conf  —  Wey Bot Deriv  (actualizado)
#
#  Puertos internos (VPS):
#    NestJS (PM2 bot-indices) : 3038   ← PORT en ecosystem.config.cjs
#    Frontend dev / static    : 5174   ← si aplica
#
#  Rutas públicas:
#    /bot/socket.io/  →  WebSocket Socket.io  (namespace /realtime)
#    /bot/api/        →  REST API NestJS  (global prefix "api")
#    /bot/*           →  SPA Quasar (servido por NestJS internamente)
#    /api/            →  alias REST API (mismo backend)
##############################################################################

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name 2.58.80.90;

    # =========================================================================
    # 1. WebSocket Socket.io  (/bot/socket.io/ → NestJS :3038/socket.io/)
    #    DEBE ir ANTES de /bot/ para tener prioridad en el matching de nginx.
    #    NestJS tiene un middleware en main.ts que reescribe /bot/socket.io
    #    → /socket.io antes de pasarlo al adapter de Socket.io.
    # =========================================================================
    location /bot/socket.io/ {
        proxy_pass         http://127.0.0.1:3038/socket.io/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Mantener la conexión WebSocket viva (24 h máximo)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;
    }

    # =========================================================================
    # 2. REST API bajo /bot/api/  → NestJS :3038/api/
    #    (Útil cuando el cliente llama con base-URL relativa desde /bot)
    # =========================================================================
    location /bot/api/ {
        proxy_pass         http://127.0.0.1:3038/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # =========================================================================
    # 3. REST API pública /api/  → mismo NestJS :3038/api/
    # =========================================================================
    location /api/ {
        proxy_pass         http://127.0.0.1:3038/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # =========================================================================
    # 4. SPA Quasar + resto de rutas /bot/  → NestJS :3038 (sirve el SPA)
    #    NestJS en main.ts sirve la SPA bajo /bot y redirige / → /bot/
    # =========================================================================
    location = /bot {
        return 301 /bot/;
    }

    location /bot/ {
        proxy_pass         http://127.0.0.1:3038/bot/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # =========================================================================
    # 5. Raíz /  → redirigir a /bot/
    # =========================================================================
    location / {
        return 301 /bot/;
    }
}
